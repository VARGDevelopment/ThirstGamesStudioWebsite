<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Thirst Games Studio</title>
  <meta name="robots" content="noindex">
  <style>
    /* Self-contained: GitHub Pages serves this file at any missing path, so relative asset links would break. */
    :root { --bg: #0a0c0e; --fg: #e6ebf0; --muted: #8b96a1; --accent: #b9cbdb; --on-accent: #0a0c0e; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }
    .code { margin: 0; color: var(--accent); font: 700 clamp(4rem, 18vw, 9rem)/1 "Arial Narrow", sans-serif; letter-spacing: 0.08em; }
    h1 { margin: 12px 0 0; font-size: 1.4rem; letter-spacing: 0.12em; text-transform: uppercase; }
    p { color: var(--muted); }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 16px 26px;
      border-radius: 4px;
      background: var(--accent);
      color: var(--on-accent);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Nothing here</h1>
    <p>This page doesn't exist — or it never did.</p>
    <a id="home" href="/">Back to the studio</a>
  </main>
</body>
</html>
